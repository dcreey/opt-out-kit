id: ca-drop
name: California DROP (Delete Request and Opt-out Platform)
tier: A
fields: [full_name, email, address]
steps:
  - open: https://privacy.ca.gov/drop/
  - say: "Start your deletion request. Confirm that you live in California through the state's Identity Gateway (or Login.gov if you already have an account). Only you can do this; this app never does it for you."
    confirm: true
  - copy: full_name
  - copy: email
  - copy: address
  - say: "Choose how much to share and submit the request. Brokers match you using what you give, so more details means more records found. Enter only what you are comfortable with."
    confirm: true
  - say: "Save the confirmation. Registered brokers must check DROP every 45 days and can take up to 90 more days to report back. We hold off our own opt-out requests to the sites DROP covers for 90 days, then check whether you are still listed."
    confirm: true
recheck_days: 90
processing_days: 45
verified: null   # PLACEHOLDER: steps drafted from privacy.ca.gov/drop; confirm the exact screens on the first real run
platform:
  short_name: California DROP
  jurisdiction: California
  states: [CA]
  request_url: https://privacy.ca.gov/drop/
  hold_days: 90
  live: true
  summary: "One free request to every data broker registered in California (600+). A California resident, or a parent or family member for someone who cannot, submits it once; brokers must process it from August 2026."
  coverage_file: ca-drop-coverage.json
# Registry source: https://cppa.ca.gov/data_broker_registry/ (refresh with tools/registries.py).
# Other jurisdictions: add another platforms/<id>.yml in this shape. Connecticut announced a similar mechanism (brokers register from
# October 2026) and Vermont one for 2027; neither is open yet, so they are not listed.
