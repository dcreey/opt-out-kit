name: CI

# Every push to main and every pull request. The repository is public, so GitHub's hosted runners are free; the app's tests are split across
# several macOS machines that run at once (tools/ci_shards.py decides the split, so new test classes are picked up by themselves).
# No job contacts a real broker site: the live tests skip unless OPTOUT_LIVE=1, and the UI tests use the app's fake sites (-uitest-fake-submit).
# What runs where is listed in docs/TESTING.md ("Continuous integration").
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODEGEN_VERSION: 2.45.4
  # Raise to throw away every cached build folder (if a cached build ever looks wrong).
  CACHE_VERSION: v1
  # Tests known to fail, left out until they are fixed (docs/TESTING.md lists them). Empty: every test runs.
  KNOWN_FAILING: ""
  # GitHub's free plan runs at most 5 macOS jobs at once: the test shards are 5, each a mix of unit and UI tests balanced by measured time.
  SHARDS: 5
  # Shard 0 also runs the two Swift packages' tests (about this long on these machines), so it is given that much less of the app's tests.
  PACKAGES_SECONDS: 120

jobs:
  checks:
    name: Data, tools and translations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install check-jsonschema pyyaml
      - name: Broker and directory files match their schemas
        run: |
          check-jsonschema --schemafile schema/broker.schema.json brokers/*.yml
          check-jsonschema --schemafile schema/directory.schema.json directory/*.yml
      - name: Tool tests (retries, backoff, robots handling, registries, translations)
        run: python3 -m unittest discover -s tools/tests
      - name: Every string is translated, with its placeholders
        run: python3 tools/l10n.py check
      - name: The test shards (by measured time, tools/ci_timings.json)
        run: python3 tools/ci_shards.py --shards $SHARDS --reserve 0:$PACKAGES_SECONDS --list

  test:
    name: Tests ${{ matrix.index }}
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        index: [0, 1, 2, 3, 4]          # keep in step with SHARDS
    steps:
      - name: Start booting a simulator first (the steps after it mostly wait on the network, so the boot gets the processor)
        id: xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
          echo "version=$(xcodebuild -version | tr '\n' ' ' | tr -cs 'A-Za-z0-9.' '-')" >> "$GITHUB_OUTPUT"
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if 'iPhone' in x['name']))")
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
          # Boots in the background and notes when it is ready (reported in a notice below).
          nohup sh -c "xcrun simctl boot $UDID; xcrun simctl bootstatus $UDID -b; date +%s > $RUNNER_TEMP/simready" > $RUNNER_TEMP/simboot.log 2>&1 &
      - uses: actions/checkout@v4
        with: { fetch-depth: 100 }          # recent history is enough for the file times below
      - name: Restore the generated project (XcodeGen runs only when project.yml or the list of files changed)
        id: xcproj
        uses: actions/cache@v4
        with:
          path: |
            OptOutKit.xcodeproj
            App/Info.plist
            ShareExtension/Info.plist
          key: xcproj-${{ env.XCODEGEN_VERSION }}-${{ hashFiles('project.yml') }}-${{ hashFiles('.github/workflows/ci.yml') }}-${{ github.sha }}
          restore-keys: xcproj-${{ env.XCODEGEN_VERSION }}-${{ hashFiles('project.yml') }}-
      - name: Check the restored project matches this commit's files
        id: files
        run: |
          LIST=$(git ls-files | shasum | cut -c1-16)
          if [ -f OptOutKit.xcodeproj/.files ] && [ "$(cat OptOutKit.xcodeproj/.files)" = "$LIST" ]; then echo "same=true" >> "$GITHUB_OUTPUT"; else echo "same=false" >> "$GITHUB_OUTPUT"; fi
          echo "list=$LIST" >> "$GITHUB_OUTPUT"
      - name: Restore XcodeGen
        if: steps.files.outputs.same != 'true'
        id: xcodegen
        uses: actions/cache@v4
        with:
          path: ~/xcodegen
          key: xcodegen-${{ env.XCODEGEN_VERSION }}
      - name: Download XcodeGen (only when it is not cached; brew is slow on these machines)
        if: steps.files.outputs.same != 'true' && steps.xcodegen.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          mkdir -p ~/xcodegen && unzip -q /tmp/xcodegen.zip -d ~/xcodegen
      - name: Generate the project
        if: steps.files.outputs.same != 'true'
        run: |
          XG=$(find ~/xcodegen -type f -name xcodegen -perm -u+x | head -1)
          "$XG" --version && "$XG" generate
          echo "${{ steps.files.outputs.list }}" > OptOutKit.xcodeproj/.files
      - name: Give each file its last commit's time (so a restored build folder rebuilds only what changed)
        run: python3 tools/ci_restore_mtimes.py
      - name: Restore the app's build folder
        id: dd
        uses: actions/cache/restore@v4
        with:
          path: DerivedData
          key: dd-${{ env.CACHE_VERSION }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('project.yml', 'App/**', 'Shared/**', 'ShareExtension/**', 'AppTests/**', 'AppUITests/**', 'Packages/**/Sources/**', 'brokers/**', 'directory/**', 'platforms/**', 'jurisdictions/**', 'terms/**') }}
          restore-keys: dd-${{ env.CACHE_VERSION }}-${{ steps.xcode.outputs.version }}-
      - name: Build the app and its tests (while the simulator boots)
        run: |
          set -o pipefail
          # At lower priority, so the simulator still booting gets the processor first (these machines have three cores).
          nice -n 10 xcodebuild build-for-testing -project OptOutKit.xcodeproj -scheme OptOutKit \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData \
            COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO 2>&1 | tee build.log | tail -20
          echo "::notice title=Build::$(grep -cE '^SwiftCompile ' build.log || true) Swift files compiled (cache: ${{ steps.dd.outputs.cache-hit == 'true' && 'exact' || steps.dd.outputs.cache-matched-key != '' && 'earlier build' || 'none' }})"
      - name: Keep the build folder for the next run (one shard saves it, without logs, so it does not grow)
        if: matrix.index == 0 && steps.dd.outputs.cache-hit != 'true'
        run: rm -rf DerivedData/Logs DerivedData/Index.noindex && du -sh DerivedData
      - if: matrix.index == 0 && steps.dd.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: DerivedData
          key: ${{ steps.dd.outputs.cache-primary-key }}
      - name: Wait for the simulator
        run: |
          xcrun simctl bootstatus "$SIM_UDID" -b || { cat $RUNNER_TEMP/simboot.log; exit 1; }
          while [ ! -f $RUNNER_TEMP/simready ]; do sleep 1; done
          echo "::notice title=Simulator::ready $(( $(cat $RUNNER_TEMP/simready) - JOB_START )) s after the job started; tests start $(( $(date +%s) - JOB_START )) s in"
      - name: Run this shard
        shell: bash
        run: |
          SKIP=(); for t in $KNOWN_FAILING; do SKIP+=(--skip "$t"); done
          ARGS=()          # one argument per line (macOS ships bash 3.2, which has no mapfile)
          while IFS= read -r a; do ARGS+=("$a"); done < <(python3 tools/ci_shards.py --shards $SHARDS --reserve 0:$PACKAGES_SECONDS --index ${{ matrix.index }} ${SKIP[@]+"${SKIP[@]}"})
          printf '%s\n' "${ARGS[@]}"
          XCTESTRUN=$(ls DerivedData/Build/Products/*.xctestrun | head -1)
          set -o pipefail
          xcodebuild test-without-building -xctestrun "$XCTESTRUN" -destination "id=$SIM_UDID" \
            -resultBundlePath "Results-${{ matrix.index }}.xcresult" "${ARGS[@]}" 2>&1 | tee xcodebuild.log \
            | grep -E "Test Case .*(passed|failed)|error:|Executed [0-9]+ tests|TEST (SUCCEEDED|FAILED)|\*\* "
          # A shard that ran nothing is a broken shard, not a pass.
          if ! grep -qE "Executed [1-9][0-9]* tests" xcodebuild.log; then echo "::error::this shard ran no tests"; exit 1; fi
      - name: Report each test's time (read back by `tools/ci_shards.py --fetch-run` to balance the next split) and each failure
        if: always()
        run: |
          [ -f xcodebuild.log ] || exit 0
          echo "::notice title=Shard timings::$(python3 tools/ci_shards.py --timings-from-log xcodebuild.log)"
          python3 tools/ci_shards.py --failures-from-log xcodebuild.log
      - name: Restore the packages' build folders
        if: matrix.index == 0 && !cancelled()
        id: spm
        uses: actions/cache/restore@v4
        with:
          path: |
            Packages/OptOutKitCore/.build
            Packages/AssistedRunLogic/.build
          key: spm-${{ env.CACHE_VERSION }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('Packages/**/Package.swift', 'Packages/**/Sources/**', 'Packages/**/Tests/**', 'Shared/**') }}
          restore-keys: spm-${{ env.CACHE_VERSION }}-${{ steps.xcode.outputs.version }}-
      - name: Package tests (OptOutKitCore, and AssistedRunLogic, the assisted run's state machine)
        if: matrix.index == 0 && !cancelled()
        run: |
          (cd Packages/OptOutKitCore && swift test)
          (cd Packages/AssistedRunLogic && swift test)
      - name: Keep the packages' build folders for the next run
        if: matrix.index == 0 && !cancelled() && steps.spm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            Packages/OptOutKitCore/.build
            Packages/AssistedRunLogic/.build
          key: ${{ steps.spm.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: results-${{ matrix.index }}
          path: Results-${{ matrix.index }}.xcresult
          retention-days: 7
