name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registry:
    name: Validate broker YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install check-jsonschema
      - run: check-jsonschema --schemafile schema/broker.schema.json brokers/*.yml

  core:
    name: Core package tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test
        working-directory: Packages/OptOutKitCore

  app:
    name: iOS build and tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen generate
      - name: Pick an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available iPhone -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if 'iPhone' in x['name']))")
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
      - name: Build and test (unit + UI)
        run: |
          xcodebuild test -project OptOutKit.xcodeproj -scheme OptOutKit \
            -destination "id=$SIM_UDID" CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO
