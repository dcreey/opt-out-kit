name: 'CI'

# Unit tests, on every push to main and every pull request (the UI tests are integration tests: .github/workflows/integration.yml, run for a release).
# The repository is public, so GitHub's hosted runners are free. The app's unit tests are split across several macOS machines that run at once
# (tools/ci_shards.py decides the split, so new test classes are picked up by themselves). No job contacts a real broker site: the live tests skip
# unless OPTOUT_LIVE=1. What runs where: docs/TESTING.md ("Unit and integration tests", "Continuous integration").
on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

concurrency:
  group: 'ci-${{ github.ref }}'
  cancel-in-progress: true

env:
  XCODEGEN_VERSION: '2.45.4'
  # Raise to throw away every cached build folder (if a cached build ever looks wrong).
  CACHE_VERSION: 'v1'
  # Tests known to fail, left out until they are fixed (docs/TESTING.md lists them). Empty: every test runs.
  KNOWN_FAILING: ''
  # GitHub's free plan runs at most 5 macOS jobs at once: 4 shards of the app's unit tests, balanced by measured time, and the package tests.
  SHARDS: 4
  SUITE: 'OptOutKitTests'
  # Shard 0 builds the app for every shard (the others wait for it meanwhile, booting their simulators). It boots its simulator only after the build
  # (about two minutes), so it is given that much less.
  PACKAGES_SECONDS: 120

jobs:
  # Lint: one small job each, on Linux (seconds, and no macOS machine taken from the tests). Pinned versions, so a new release never fails a push by itself.
  # What each checks and why: docs/TESTING.md, "Lint".
  lint-actions:
    name: 'Lint: GitHub Actions'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    steps:
      - uses: 'actions/checkout@v4'
      - run: 'pip install actionlint-py==1.7.12.25 shellcheck-py==0.11.0.1'
      # Every workflow: expressions, job and step keys, and each `run:` script through shellcheck.
      - run: 'actionlint'

  lint-swift:
    name: 'Lint: Swift'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    container: 'ghcr.io/realm/swiftlint:0.65.1'        # the version the rules were tuned with
    steps:
      - uses: 'actions/checkout@v4'
      # Only the rules in .swiftlint.yml (mistakes, not layout); warnings fail too.
      - run: 'swiftlint lint --strict --quiet --reporter github-actions-logging'

  lint-yaml:
    name: 'Lint: YAML'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    steps:
      - uses: 'actions/checkout@v4'
      - run: 'pip install yamllint==1.38.0'
      # Every YAML file, hand-written or written by the tools (tools/yamlio.py writes this style): the abcxyz rules in .yamllint.yml.
      - run: 'git ls-files -z ''*.yml'' ''*.yaml'' | xargs -0 yamllint -f github'

  lint-json:
    name: 'Lint: JSON'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    steps:
      - uses: 'actions/checkout@v4'
      # Every JSON file, string catalog and the page-script lockfile parses.
      - run: 'git ls-files -z ''*.json'' ''*.xcstrings'' | xargs -0 -n 50 python3 -c ''import json, sys; [json.load(open(p, encoding="utf-8")) for p in sys.argv[1:]]'''

  lint-python:
    name: 'Lint: Python'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    steps:
      - uses: 'actions/checkout@v4'
      - run: 'pip install ruff==0.17.6'
      # Errors only (pyflakes and syntax: unused imports and variables, undefined names), not style: the tools use one-line statements on purpose.
      - run: 'ruff check --isolated --select E9,F,B018 --output-format github .'

  lint-shell:
    name: 'Lint: shell scripts'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    steps:
      - uses: 'actions/checkout@v4'
      - run: 'pip install shellcheck-py==0.11.0.1'
      - run: 'git ls-files -z ''*.sh'' | xargs -0 shellcheck'

  checks:
    name: 'Data, tools and translations'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 15
    steps:
      - uses: 'actions/checkout@v4'
      - run: 'pip install check-jsonschema pyyaml -r tools/requirements.txt'          # the tools' own needs: tools/requirements.txt
      - name: 'Broker and directory files match their schemas'
        run: |
          check-jsonschema --schemafile schema/broker.schema.json brokers/*.yml
          check-jsonschema --schemafile schema/directory.schema.json directory/*.yml
      - name: 'Tool tests (retries, backoff, robots handling, registries, translations)'
        run: 'python3 -m unittest discover -s tools/tests'
      - name: 'Every string is translated, with its placeholders'
        run: 'python3 tools/l10n.py check'
      - uses: 'actions/setup-node@v4'
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'tools/pagescripts/package-lock.json'
      - name: 'Page scripts (the app''s JavaScript for web pages, run in a headless DOM)'
        working-directory: 'tools/pagescripts'
        run: 'npm ci --no-audit --no-fund && npm test'
      - name: 'The test shards (by measured time, tools/ci_timings.json)'
        run: 'python3 tools/ci_shards.py --suite "$SUITE" --shards "$SHARDS" --reserve "0:$PACKAGES_SECONDS" --list'

  packages:
    name: 'Mac package tests'
    runs-on: 'macos-26'
    timeout-minutes: 20
    steps:
      - name: 'Use the newest Xcode'
        id: 'xcode'
        run: |
          sudo xcode-select -s "$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V | tail -1)"
          echo "version=$(xcodebuild -version | tr '\n' ' ' | tr -cs 'A-Za-z0-9.' '-')" >> "$GITHUB_OUTPUT"
      - uses: 'actions/checkout@v4'
      - name: 'Give each file a time worked out from its contents (so the restored .build folders rebuild only what changed)'
        run: 'python3 tools/ci_file_times.py'
      - name: 'Fingerprint the packages from git''s tree hashes'
        id: 'pkgsrc'
        run: 'echo "hash=$(git ls-tree HEAD Packages Shared | shasum | cut -c1-20)" >> "$GITHUB_OUTPUT"'
      - name: 'Restore the packages'' build folders (saved again by the post step, at the end of the job)'
        id: 'spm'
        uses: 'actions/cache@v4'
        with:
          path: |
            Packages/OptOutKitCore/.build
            Packages/AssistedRunLogic/.build
          key: 'spm-${{ env.CACHE_VERSION }}-${{ steps.xcode.outputs.version }}-${{ steps.pkgsrc.outputs.hash }}'
          restore-keys: 'spm-${{ env.CACHE_VERSION }}-${{ steps.xcode.outputs.version }}-'
      - name: 'Package tests (OptOutKitCore, and AssistedRunLogic, the assisted run''s state machine)'
        run: |
          (cd Packages/OptOutKitCore && swift test --disable-automatic-resolution)
          (cd Packages/AssistedRunLogic && swift test --disable-automatic-resolution)

  test:
    name: 'Unit tests ${{ matrix.index }}'
    runs-on: 'macos-26'
    timeout-minutes: 45
    permissions:
      contents: 'read'
      actions: 'read'        # shards 1 to 4 look up shard 0's build in this run
    strategy:
      fail-fast: false
      matrix:
        index: [0, 1, 2, 3]          # keep in step with SHARDS
    steps:
      # Checked out before the simulator starts booting: a booting simulator starves the machine, and the checkout (38 MB) took 104 to 119 s on the
      # shards that boot first. One commit, no history, for every job (file times come from contents: tools/ci_file_times.py). Shard 0 builds, so it
      # takes the whole tree; the others only test, so they take just what they read (the shard splitter, its timings and the test sources it lists the
      # tests from), about 1 MB.
      - uses: 'actions/checkout@v4'
        if: 'matrix.index == 0'
      - uses: 'actions/checkout@v4'
        if: 'matrix.index != 0'
        with:
          fetch-depth: 1
          sparse-checkout: |
            tools
            AppTests
            AppUITests
          sparse-checkout-cone-mode: true
      - name: 'Start booting a simulator (the steps after it mostly wait on the network, so the boot gets the processor)'
        id: 'xcode'
        run: |
          sudo xcode-select -s "$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V | tail -1)"
          xcodebuild -version
          echo "version=$(xcodebuild -version | tr '\n' ' ' | tr -cs 'A-Za-z0-9.' '-')" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"          # the build-folder cache starts afresh each week, so it never grows
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if 'iPhone' in x['name']))")
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
          # Boots in the background and notes when it is ready (reported in a notice below). Not on shard 0: it builds for everyone, and a booting
          # simulator starves the machine (its checkout took three minutes), so it boots once the build is handed over.
          if [ "${{ matrix.index }}" != "0" ]; then
            nohup sh -c "xcrun simctl boot $UDID; xcrun simctl bootstatus $UDID -b; date +%s > $RUNNER_TEMP/simready" > "$RUNNER_TEMP/simboot.log" 2>&1 &
          fi
      - name: 'Restore the generated project (XcodeGen runs only when project.yml or the list of files changed)'
        if: 'matrix.index == 0'
        id: 'xcproj'
        uses: 'actions/cache@v4'
        with:
          path: |
            OptOutKit.xcodeproj
            App/Info.plist
            ShareExtension/Info.plist
          key: 'xcproj-${{ env.XCODEGEN_VERSION }}-${{ hashFiles(''project.yml'') }}-${{ hashFiles(''.github/workflows/ci.yml'') }}-${{ github.sha }}'
          restore-keys: 'xcproj-${{ env.XCODEGEN_VERSION }}-${{ hashFiles(''project.yml'') }}-'
      - name: 'Check the restored project matches this commit''s files'
        if: 'matrix.index == 0'
        id: 'files'
        run: |
          LIST=$(git ls-files | shasum | cut -c1-16)
          if [ -f OptOutKit.xcodeproj/.files ] && [ "$(cat OptOutKit.xcodeproj/.files)" = "$LIST" ]; then echo "same=true" >> "$GITHUB_OUTPUT"; else echo "same=false" >> "$GITHUB_OUTPUT"; fi
          echo "list=$LIST" >> "$GITHUB_OUTPUT"
      - name: 'Restore XcodeGen'
        if: 'matrix.index == 0 && steps.files.outputs.same != ''true'''
        id: 'xcodegen'
        uses: 'actions/cache@v4'
        with:
          path: '~/xcodegen'
          key: 'xcodegen-${{ env.XCODEGEN_VERSION }}'
      - name: 'Download XcodeGen (only when it is not cached; brew is slow on these machines)'
        if: 'matrix.index == 0 && steps.files.outputs.same != ''true'' && steps.xcodegen.outputs.cache-hit != ''true'''
        run: |
          curl -fsSL -o /tmp/xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          mkdir -p ~/xcodegen && unzip -q /tmp/xcodegen.zip -d ~/xcodegen
      - name: 'Generate the project'
        if: 'matrix.index == 0 && steps.files.outputs.same != ''true'''
        run: |
          XG=$(find ~/xcodegen -type f -name xcodegen -perm -u+x | head -1)
          "$XG" --version && "$XG" generate
          echo "${{ steps.files.outputs.list }}" > OptOutKit.xcodeproj/.files
      - name: 'Give each file a time worked out from its contents (so a restored build folder rebuilds only what changed)'
        if: 'matrix.index == 0'
        run: 'python3 tools/ci_file_times.py'
      - name: 'Pin the packages for Xcode (the committed lockfile; the build then resolves nothing over the network)'
        if: 'matrix.index == 0'
        run: |
          mkdir -p OptOutKit.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Packages/OptOutKitCore/Package.resolved OptOutKit.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
      - name: 'Fingerprint the sources from git''s own tree hashes (hashing every file took over two minutes and timed out)'
        if: 'matrix.index == 0'
        id: 'src'
        run: 'echo "hash=$(git ls-tree HEAD project.yml App Shared ShareExtension AppTests AppUITests Packages brokers directory platforms jurisdictions terms | shasum | cut -c1-20)" >> "$GITHUB_OUTPUT"'
      - name: 'Restore the app''s build folder (saved again by this step''s post step, at the end of the job, so nothing waits for it)'
        if: 'matrix.index == 0'
        id: 'dd'
        uses: 'actions/cache@v4'
        with:
          path: 'DerivedData'
          key: 'dd-${{ env.CACHE_VERSION }}-${{ steps.xcode.outputs.version }}-${{ steps.xcode.outputs.week }}-${{ steps.src.outputs.hash }}'
          restore-keys: 'dd-${{ env.CACHE_VERSION }}-${{ steps.xcode.outputs.version }}-${{ steps.xcode.outputs.week }}-'
      - name: 'Build the app and its tests once, for every shard'
        if: 'matrix.index == 0'
        run: |
          set -o pipefail
          # Which cache the build started from (actions/cache only says whether the key matched exactly; a build folder already here means an earlier one).
          if [ "${{ steps.dd.outputs.cache-hit }}" = true ]; then CACHE=exact; elif [ -d DerivedData ]; then CACHE="earlier build"; else CACHE=none; fi
          xcodebuild build-for-testing -project OptOutKit.xcodeproj -scheme OptOutKit \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData \
            -disableAutomaticPackageResolution -skipPackagePluginValidation -skipMacroValidation -showBuildTimingSummary \
            ASSETCATALOG_COMPILER_APPICON_NAME= \
            COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO 2>&1 | tee build.log | tail -20
          # No app icon in the test build: rendering its variants took over three minutes on these machines (CI only; release builds keep it).
          # Where the build's time went (the slowest kinds of step), how much it compiled, and how big the build folder is.
          python3 tools/ci_shards.py --build-summary build.log --cache "$CACHE" --folder DerivedData
      - name: 'Hand the build to the other shards'
        if: 'matrix.index == 0'
        uses: 'actions/upload-artifact@v4'
        with:
          name: 'test-products'
          path: 'DerivedData/Build/Products'
          retention-days: 1
      - name: 'Boot shard 0''s simulator now that the build is handed over'
        if: 'matrix.index == 0'
        run: 'nohup sh -c "xcrun simctl boot $SIM_UDID; xcrun simctl bootstatus $SIM_UDID -b; date +%s > $RUNNER_TEMP/simready" > "$RUNNER_TEMP/simboot.log" 2>&1 &'
      - name: 'Wait for shard 0''s build (the simulator boots meanwhile; this shard compiles nothing)'
        if: 'matrix.index != 0'
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          API="https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          for _ in $(seq 1 180); do
            n=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "$API/artifacts?name=test-products" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("total_count", 0))' || echo 0)
            [ "$n" -gt 0 ] && { echo "the build arrived after $(( $(date +%s) - JOB_START )) s"; exit 0; }
            gone=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "$API/jobs?per_page=30" | python3 -c 'import json,sys; print(any(j["name"] == "Unit tests 0" and j["status"] == "completed" for j in json.load(sys.stdin)["jobs"]))' || echo False)
            [ "$gone" = True ] && { echo "::error::shard 0 ended without handing over its build"; exit 1; }
            sleep 5
          done
          echo "::error::no build from shard 0 after 15 minutes"; exit 1
      - name: 'Download the build'
        if: 'matrix.index != 0'
        uses: 'actions/download-artifact@v4'
        with:
          name: 'test-products'
          path: 'DerivedData/Build/Products'
      - name: 'Leave the logs out of the build folder the post step saves (so the cache does not grow)'
        if: 'always() && matrix.index == 0'
        run: 'rm -rf DerivedData/Logs DerivedData/Index.noindex && du -sh DerivedData'
      - name: 'Wait for the simulator'
        run: |
          # The boot started in the background finishes first (up to 10 minutes): asking for the boot status while that boot is still under way raced
          # with it and failed shard 0 twice ("Wait for the simulator", c1b0c04 and e08dfbe). Then one check that it really booted.
          for _ in $(seq 1 600); do [ -f "$RUNNER_TEMP/simready" ] && break; sleep 1; done
          [ -f "$RUNNER_TEMP/simready" ] || { echo "::error::the simulator did not boot in 10 minutes"; cat "$RUNNER_TEMP/simboot.log"; exit 1; }
          xcrun simctl bootstatus "$SIM_UDID" -b || { cat "$RUNNER_TEMP/simboot.log"; exit 1; }
          echo "::notice title=Simulator::ready $(( $(cat "$RUNNER_TEMP/simready") - JOB_START )) s after the job started; tests start $(( $(date +%s) - JOB_START )) s in"
      - name: 'Run this shard'
        shell: 'bash'
        run: |
          SKIP=(); for t in $KNOWN_FAILING; do SKIP+=(--skip "$t"); done
          ARGS=()          # one argument per line (macOS ships bash 3.2, which has no mapfile)
          while IFS= read -r a; do ARGS+=("$a"); done < <(python3 tools/ci_shards.py --suite "$SUITE" --shards "$SHARDS" --reserve "0:$PACKAGES_SECONDS" --index "${{ matrix.index }}" ${SKIP[@]+"${SKIP[@]}"})
          printf '%s\n' "${ARGS[@]}"
          XCTESTRUN=$(find DerivedData/Build/Products -maxdepth 1 -name '*.xctestrun' | head -1)
          set -o pipefail
          xcodebuild test-without-building -xctestrun "$XCTESTRUN" -destination "id=$SIM_UDID" \
            -resultBundlePath "Results-${{ matrix.index }}.xcresult" "${ARGS[@]}" 2>&1 | tee xcodebuild.log \
            | grep -E "Test Case .*(passed|failed)|error:|Executed [0-9]+ tests|TEST (SUCCEEDED|FAILED)|\*\* "
          # A shard that ran nothing is a broken shard, not a pass.
          if ! grep -qE "Executed [1-9][0-9]* tests" xcodebuild.log; then echo "::error::this shard ran no tests"; exit 1; fi
      - name: 'Report each test''s time (read back by `tools/ci_shards.py --fetch-run` to balance the next split) and each failure'
        if: 'always()'
        run: |
          [ -f xcodebuild.log ] || exit 0
          echo "::notice title=Shard timings::$(python3 tools/ci_shards.py --timings-from-log xcodebuild.log)"
          python3 tools/ci_shards.py --failures-from-log xcodebuild.log
      - uses: 'actions/upload-artifact@v4'
        if: 'failure()'
        with:
          name: 'results-${{ matrix.index }}'
          path: 'Results-${{ matrix.index }}.xcresult'
          retention-days: 7
