name: Refresh directory

# Re-profiles every site (and checks every hand-written broker link) in pipeline/census-sites.txt (polite, robots.txt honored, about 1 request per second per site)
# and opens a pull request when the generated directory/ files change. Nothing is merged automatically: a person
# reviews the diff, which is how a changed opt-out page gets noticed.
# DISABLED for now: runs only when started by hand from the Actions tab. Original triggers are kept below, commented out.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 13 * * 1"   # weekly, Mondays

permissions:
  contents: write
  pull-requests: write

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull every state's broker registry (Texas needs a headless browser), join them and add new sites to the census
        run: |
          pip install playwright && playwright install --with-deps chromium
          python3 tools/registries.py fetch
          python3 tools/registries.py merge --add-sites
      - name: Flag state-law facts nobody has reviewed in six months
        run: python3 tools/check_jurisdictions.py
      - run: python3 tools/profile_brokers.py --refresh --workers 6
      - name: Check every recorded opt-out link, crawl for new ones when broken (fails if a hand-written broker link is lost)
        run: python3 tools/check_links.py --workers 6
      - run: pip install check-jsonschema && check-jsonschema --schemafile schema/directory.schema.json directory/*.yml
      - uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/refresh-directory
          title: "Refresh generated broker directory"
          commit-message: "Refresh generated broker directory"
          body: "Automated re-profile of the directory. Review changes to tiers, opt-out URLs and families before merging."
          add-paths: |
            directory/
            platforms/
            registries/
            pipeline/

