name: 'Integration'

# The integration tests: the app's UI tests, driving the real app on a simulator (unit tests run on every push: ci.yml). They run when a GitHub release
# is published (a release is the app going to the App Store; TestFlight needs only ci.yml), when started by hand from the Actions tab, and the run over
# every site also weekly. Sending is faked (-uitest-fake-submit): no broker site is contacted. docs/TESTING.md, "Unit and integration tests".
on:
  release:
    types: ['published']
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'          # Mondays, 09:00 UTC: only the run over every site (the UI tests run for a release)

concurrency:
  group: 'integration-${{ github.ref }}'
  cancel-in-progress: true

env:
  XCODEGEN_VERSION: '2.45.4'
  # Raise to throw away every cached build folder (if a cached build ever looks wrong).
  CACHE_VERSION: 'v1'
  # Tests known to fail, left out until they are fixed (docs/TESTING.md lists them). Empty: every test runs.
  KNOWN_FAILING: ''
  # GitHub's free plan runs at most 5 macOS jobs at once: the UI tests in 5 shards, balanced by measured time.
  SHARDS: 5
  SUITE: 'OptOutKitUITests'
  # Every shard builds the app from the cache while its simulator boots; shard 0 then also saves the caches (about a minute), so it is given that much less.
  SAVE_SECONDS: 60

jobs:
  ui:
    name: 'UI tests ${{ matrix.index }}'
    if: 'github.event_name != ''schedule'''
    runs-on: 'macos-26'
    timeout-minutes: 45
    permissions:
      contents: 'read'
    strategy:
      fail-fast: false
      matrix:
        index: [0, 1, 2, 3, 4]          # keep in step with SHARDS
    steps:
      # Checked out before the simulator starts booting: a booting simulator starves the machine. One commit, no history (file times come from
      # contents: tools/ci_file_times.py).
      - uses: 'actions/checkout@v4'
      - name: 'Start booting a simulator (the steps after it mostly wait on the network, so the boot gets the processor)'
        id: 'xcode'
        run: |
          sudo xcode-select -s "$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V | tail -1)"
          xcodebuild -version
          echo "version=$(xcodebuild -version | tr '\n' ' ' | tr -cs 'A-Za-z0-9.' '-')" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"          # the build-folder cache starts afresh each week, so it never grows
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if 'iPhone' in x['name']))")
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
          # Boots in the background while the shard builds for itself from the cache (as in ci.yml), and notes when it is ready (a notice below).
          nohup sh -c "xcrun simctl boot $UDID; xcrun simctl bootstatus $UDID -b; date +%s > $RUNNER_TEMP/simready" > "$RUNNER_TEMP/simboot.log" 2>&1 &
      - name: 'Restore the generated project (XcodeGen runs only when project.yml or the list of files changed)'
        id: 'xcproj'
        uses: 'actions/cache/restore@v4'
        with:
          path: |
            OptOutKit.xcodeproj
            App/Info.plist
            ShareExtension/Info.plist
          key: 'xcproj-${{ env.XCODEGEN_VERSION }}-${{ hashFiles(''project.yml'') }}-${{ hashFiles(''.github/workflows/ci.yml'') }}-${{ github.sha }}'
          restore-keys: 'xcproj-${{ env.XCODEGEN_VERSION }}-${{ hashFiles(''project.yml'') }}-'
      - name: 'Check the restored project matches this commit''s files'
        id: 'files'
        run: |
          LIST=$(git ls-files | shasum | cut -c1-16)
          if [ -f OptOutKit.xcodeproj/.files ] && [ "$(cat OptOutKit.xcodeproj/.files)" = "$LIST" ]; then echo "same=true" >> "$GITHUB_OUTPUT"; else echo "same=false" >> "$GITHUB_OUTPUT"; fi
          echo "list=$LIST" >> "$GITHUB_OUTPUT"
      - name: 'Restore XcodeGen'
        if: 'steps.files.outputs.same != ''true'''
        id: 'xcodegen'
        uses: 'actions/cache/restore@v4'
        with:
          path: '~/xcodegen'
          key: 'xcodegen-${{ env.XCODEGEN_VERSION }}'
      - name: 'Download XcodeGen (only when it is not cached; brew is slow on these machines)'
        if: 'steps.files.outputs.same != ''true'' && steps.xcodegen.outputs.cache-hit != ''true'''
        run: |
          curl -fsSL -o /tmp/xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          mkdir -p ~/xcodegen && unzip -q /tmp/xcodegen.zip -d ~/xcodegen
      - name: 'Generate the project'
        if: 'steps.files.outputs.same != ''true'''
        run: |
          XG=$(find ~/xcodegen -type f -name xcodegen -perm -u+x | head -1)
          "$XG" --version && "$XG" generate
          echo "${{ steps.files.outputs.list }}" > OptOutKit.xcodeproj/.files
      - name: 'Give each file a time worked out from its contents (so a restored build folder rebuilds only what changed)'
        run: 'python3 tools/ci_file_times.py'
      - name: 'Pin the packages for Xcode (the committed lockfile; the build then resolves nothing over the network)'
        run: |
          mkdir -p OptOutKit.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Packages/OptOutKitCore/Package.resolved OptOutKit.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
      - name: 'Fingerprint the sources from git''s own tree hashes (hashing every file took over two minutes and timed out)'
        id: 'src'
        run: 'echo "hash=$(git ls-tree HEAD project.yml App Shared ShareExtension AppTests AppUITests Packages brokers directory platforms jurisdictions terms | shasum | cut -c1-20)" >> "$GITHUB_OUTPUT"'
      - name: 'Restore the app''s build folder (shard 0 saves it again at the end of its job, so nothing waits for it)'
        id: 'dd'
        uses: 'actions/cache/restore@v4'
        with:
          path: 'DerivedData'
          key: 'dd-${{ env.CACHE_VERSION }}-${{ steps.xcode.outputs.version }}-${{ steps.xcode.outputs.week }}-${{ steps.src.outputs.hash }}'
          restore-keys: 'dd-${{ env.CACHE_VERSION }}-${{ steps.xcode.outputs.version }}-${{ steps.xcode.outputs.week }}-'
      - name: 'Build the app and its tests (from the cached build folder; the simulator boots meanwhile)'
        run: |
          set -o pipefail
          # Which cache the build started from (actions/cache only says whether the key matched exactly; a build folder already here means an earlier one).
          if [ "${{ steps.dd.outputs.cache-hit }}" = true ]; then CACHE=exact; elif [ -d DerivedData ]; then CACHE="earlier build"; else CACHE=none; fi
          xcodebuild build-for-testing -project OptOutKit.xcodeproj -scheme OptOutKit \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData \
            -disableAutomaticPackageResolution -skipPackagePluginValidation -skipMacroValidation -showBuildTimingSummary \
            ASSETCATALOG_COMPILER_APPICON_NAME= \
            COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO 2>&1 | tee build.log | tail -20
          # No app icon in the test build: rendering its variants took over three minutes on these machines (CI only; release builds keep it).
          # Where the build's time went (the slowest kinds of step), how much it compiled, and how big the build folder is.
          python3 tools/ci_shards.py --build-summary build.log --cache "$CACHE" --folder DerivedData
      - name: 'Leave the logs out of the build folder shard 0 saves (so the cache does not grow)'
        if: 'always() && matrix.index == 0'
        run: 'rm -rf DerivedData/Logs DerivedData/Index.noindex && du -sh DerivedData'
      - name: 'Wait for the simulator'
        run: |
          # The boot started in the background finishes first (up to 10 minutes): asking for the boot status while that boot is still under way raced
          # with it and failed shard 0 twice ("Wait for the simulator", c1b0c04 and e08dfbe). Then one check that it really booted.
          for _ in $(seq 1 600); do [ -f "$RUNNER_TEMP/simready" ] && break; sleep 1; done
          [ -f "$RUNNER_TEMP/simready" ] || { echo "::error::the simulator did not boot in 10 minutes"; cat "$RUNNER_TEMP/simboot.log"; exit 1; }
          xcrun simctl bootstatus "$SIM_UDID" -b || { cat "$RUNNER_TEMP/simboot.log"; exit 1; }
          echo "::notice title=Simulator::ready $(( $(cat "$RUNNER_TEMP/simready") - JOB_START )) s after the job started; tests start $(( $(date +%s) - JOB_START )) s in"
      - name: 'Run this shard'
        shell: 'bash'
        run: |
          SKIP=(); for t in $KNOWN_FAILING; do SKIP+=(--skip "$t"); done
          ARGS=()          # one argument per line (macOS ships bash 3.2, which has no mapfile)
          while IFS= read -r a; do ARGS+=("$a"); done < <(python3 tools/ci_shards.py --suite "$SUITE" --shards "$SHARDS" --reserve "0:$SAVE_SECONDS" --index "${{ matrix.index }}" ${SKIP[@]+"${SKIP[@]}"})
          printf '%s\n' "${ARGS[@]}"
          XCTESTRUN=$(find DerivedData/Build/Products -maxdepth 1 -name '*.xctestrun' | head -1)
          set -o pipefail
          xcodebuild test-without-building -xctestrun "$XCTESTRUN" -destination "id=$SIM_UDID" \
            -resultBundlePath "Results-${{ matrix.index }}.xcresult" "${ARGS[@]}" 2>&1 | tee xcodebuild.log \
            | grep -E "Test Case .*(passed|failed)|error:|Executed [0-9]+ tests|TEST (SUCCEEDED|FAILED)|\*\* "
          # A shard that ran nothing is a broken shard, not a pass.
          if ! grep -qE "Executed [1-9][0-9]* tests" xcodebuild.log; then echo "::error::this shard ran no tests"; exit 1; fi
      - name: 'Report each test''s time (read back by `tools/ci_shards.py --fetch-run` to balance the next split) and each failure'
        if: 'always()'
        run: |
          [ -f xcodebuild.log ] || exit 0
          echo "::notice title=Shard timings::$(python3 tools/ci_shards.py --timings-from-log xcodebuild.log)"
          python3 tools/ci_shards.py --failures-from-log xcodebuild.log
      - uses: 'actions/upload-artifact@v4'
        if: 'failure()'
        with:
          name: 'results-${{ matrix.index }}'
          path: 'Results-${{ matrix.index }}.xcresult'
          retention-days: 7
      # Only shard 0 saves the caches, after its tests (it is given SAVE_SECONDS less to run); every shard restored them at the start.
      - name: 'Save the app''s build folder'
        if: 'always() && matrix.index == 0 && steps.dd.outputs.cache-hit != ''true'''
        uses: 'actions/cache/save@v4'
        with:
          path: 'DerivedData'
          key: '${{ steps.dd.outputs.cache-primary-key }}'
      - name: 'Save the generated project'
        if: 'always() && matrix.index == 0 && steps.files.outputs.same != ''true'''
        uses: 'actions/cache/save@v4'
        with:
          path: |
            OptOutKit.xcodeproj
            App/Info.plist
            ShareExtension/Info.plist
          key: '${{ steps.xcproj.outputs.cache-primary-key }}'
      - name: 'Save XcodeGen'
        if: 'always() && matrix.index == 0 && steps.files.outputs.same != ''true'' && steps.xcodegen.outputs.cache-hit != ''true'''
        uses: 'actions/cache/save@v4'
        with:
          path: '~/xcodegen'
          key: '${{ steps.xcodegen.outputs.cache-primary-key }}'

  all-sites:
    name: 'Automatic run over every site (sending faked)'
    runs-on: 'macos-26'
    timeout-minutes: 120
    steps:
      - uses: 'actions/checkout@v4'
      - name: 'Use the newest Xcode, and start booting a simulator'
        run: |
          sudo xcode-select -s "$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V | tail -1)"
          xcodebuild -version
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if 'iPhone' in x['name']))")
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          nohup xcrun simctl boot "$UDID" > simboot.log 2>&1 &
      - name: 'XcodeGen and the project'
        run: |
          curl -fsSL -o /tmp/xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          mkdir -p ~/xcodegen && unzip -q /tmp/xcodegen.zip -d ~/xcodegen
          "$(find ~/xcodegen -type f -name xcodegen -perm -u+x | head -1)" generate
          mkdir -p OptOutKit.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Packages/OptOutKitCore/Package.resolved OptOutKit.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
      - name: 'Build'
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project OptOutKit.xcodeproj -scheme OptOutKit -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData \
            -disableAutomaticPackageResolution -skipPackagePluginValidation -skipMacroValidation \
            COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO 2>&1 | tail -20
      - run: 'xcrun simctl bootstatus "$SIM_UDID" -b'
      - name: 'Every site (TEST_RUNNER_OPTOUT_ALL_SITES=1 lifts the 25-site limit)'
        env:
          TEST_RUNNER_OPTOUT_ALL_SITES: '1'
        run: |
          set -o pipefail
          xcodebuild test-without-building -xctestrun "$(find DerivedData/Build/Products -maxdepth 1 -name '*.xctestrun' | head -1)" -destination "id=$SIM_UDID" \
            -resultBundlePath Results.xcresult \
            -only-testing:OptOutKitUITests/AutoProtectionUITests/testASiteOnTheAutomaticStatusPageOpensItsPageAndStaysThere \
            -only-testing:OptOutKitUITests/AutoProtectionUITests/testRunNowShowsWhatWasSentAndWhatNeedsYouWithoutTouchingTheInternet \
            2>&1 | tee xcodebuild.log | grep -E "Test Case .*(passed|failed)|error:|Executed [0-9]+ tests|\*\* "
      - name: 'Report failures'
        if: 'always()'
        run: '[ -f xcodebuild.log ] && python3 tools/ci_shards.py --failures-from-log xcodebuild.log || true'
      - uses: 'actions/upload-artifact@v4'
        if: 'failure()'
        with:
          name: 'e2e-results'
          path: 'Results.xcresult'
          retention-days: 14
