<h1>Privacy requests for {{site}}</h1>
<form method="POST" action="/{{site}}/send">
  <label>Full name <input type="text" name="name" required></label><br>
  <label>Email address <input type="email" name="email" required></label><br>
<p>Select all that apply:</p>
  <label><input type="checkbox" name="requests" value="know"> Know what personal information you hold about me</label><br>
  <label><input type="checkbox" name="requests" value="correct"> Correct my personal information</label><br>
  <label><input type="checkbox" name="requests" value="delete"> Delete my personal information</label><br>
  <label><input type="checkbox" name="requests" value="optout"> Opt out of the sale or sharing of my personal information</label><br>
  <!-- As on affinityanswers.com: a request option that says "consent", and a section for EU visitors the page keeps hidden. Neither is a certification. -->
  <label><input type="checkbox" name="requests" value="withdraw"> To withdraw consent. You can withdraw consent for our use of cookies at any time.</label><br>
  <div style="display:none"><label><input type="checkbox" name="eu" value="consent"> I consent to the processing of my data under the GDPR</label></div>
  <button type="submit">Submit request</button>
</form>
