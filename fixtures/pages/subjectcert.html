<h1>Opt-Out Request ({{site}})</h1>
<!-- fastbackgroundcheck.com: a required box that lets the site email the person about the request and certifies that they are its subject. -->
<form method="POST" action="/{{site}}/send">
  <label>First name * <input name="firstname" required></label><br><label>Last name * <input name="lastname" required></label><br>
  <label>Email * <input type="email" name="email" required></label><br>
  <label><input type="checkbox" name="legal" required> * I authorize this site to send communications relating to my privacy request to the email address(es) provided. I certify that I am the subject of the request, or an agent authorized to act on behalf of the subject of the request. I understand that information provided relating to this request will not be used for any purpose other than the processing of this request.</label><br>
  <button type="submit">Continue</button>
</form>
