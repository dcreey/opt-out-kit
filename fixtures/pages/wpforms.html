<h1>Privacy Request Portal ({{site}})</h1>
<!-- The arrests.org request portals (WPForms): the form checks itself (novalidate); "for myself" and "authorized agent" are both marked required, one ticked is
     enough; two bot traps with labels of random words from the page, hidden from assistive tech or out of the tab order in a box one pixel tall. -->
<form method="POST" action="/{{site}}/send" novalidate>
  <fieldset><legend>Submission Authorization: *</legend>
    <label><input type="checkbox" name="self" value="myself" required> I am submitting this request for myself.</label><br>
    <label><input type="checkbox" name="agent" value="agent" required> I am an authorized agent submitting this request on behalf of someone else.</label></fieldset>
  <div aria-hidden="true" style="position:absolute;left:74px;height:1px;overflow:hidden"><label for="t1">Privacy Address</label><input id="t1" name="trap1" tabindex="-1"></div>
  <fieldset><legend>Type of Privacy Request:</legend>
    <label><input type="checkbox" name="access" value="1"> Access my personal information.</label><br>
    <label><input type="checkbox" name="delete" value="1"> Delete my personal information.</label><br>
    <label><input type="checkbox" name="optout" value="1"> Opt-out of the sale of my personal information.</label></fieldset>
  <label>First * <input name="first" required></label><br><label>Last * <input name="last" required></label><br>
  <div style="height:1px;overflow:hidden"><label for="t2">Request: Authorization: of</label><input id="t2" name="trap2" tabindex="-1"></div>
  <label>Email * <input type="email" name="email" required></label><br>
  <label>Address Line 1 * <input name="address1" required></label><br><label>City * <input name="city" required></label><br>
  <label>State * <select name="state" required><option value="">--- Select state ---</option><option>California</option><option>Illinois</option><option>Texas</option></select></label><br>
  <label>Zip Code * <input name="zip" required></label><br>
  <button type="submit">Submit</button>
</form>
