<h1>Privacy Center for {{site}}</h1>
<p>We email you a verification code before we accept a request. Enter the code to continue.</p>
<form method="POST" action="/{{site}}/send">
  <label>Full name <input type="text" name="name" required></label><br>
  <label>Email address <input type="email" name="email" required></label><br>
  <button type="button" onclick="fetch('/{{site}}/code', {method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'}, body: 'email=' + encodeURIComponent(document.querySelector('[name=email]').value)}).then(function () { document.getElementById('codebox').style.display = 'block'; })">Email me a verification code</button>
  <div id="codebox" style="display:none">
    <p>We sent a code to your email. It expires in 10 minutes.</p>
    <label>Verification code <input type="text" name="code" inputmode="numeric" autocomplete="one-time-code"></label>
  </div>
  <p></p>
  <button type="submit">Submit request</button>
</form>
