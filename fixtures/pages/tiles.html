<h1>Privacy requests for {{site}}</h1><p>What would you like to do?</p>
<div>
  <button type="button" onclick="pick('delete')">Delete my data</button>
  <button type="button" onclick="pick('optout')">Opt out of the sale of my data</button>
  <button type="button" onclick="pick('know')">Know what you hold about me</button>
</div>
<form id="f" method="POST" action="/{{site}}/send" style="display:none">
  <label>Full name <input type="text" name="name" required></label><br>
  <label>Email address <input type="email" name="email" required></label><br>
  <label>Message <textarea name="message"></textarea></label><br>
  <input type="hidden" id="type" name="request_type" value="">
  <button type="submit">Submit request</button>
</form>
<script>function pick(k){document.getElementById('type').value=k;document.getElementById('f').style.display='block'}</script>
