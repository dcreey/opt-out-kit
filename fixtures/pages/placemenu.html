<h1>Privacy Request Form ({{site}})</h1>
<!-- saymine's home-made menus (360mediadirect.com) as a phone saw them: Country already set to "Mexico" and State to "Zacatecas" by the page, the lists closed
     (hidden by visibility and opacity). The person's country and state must be chosen instead. -->
<style>.panel{visibility:hidden;opacity:0;list-style:none;padding:0}.panel.open{visibility:visible;opacity:1}</style>
<form method="POST" action="/{{site}}/send">
  <div class="mine-dropdown"><label class="dropdown__header">Country *</label>
    <div class="dropdown__wrapper"><input type="checkbox" class="dropdown__checkbox" id="dd-country"><label class="dropdown__label" for="dd-country" data-menu="country"><span class="dropdown__selected-value">Mexico</span></label>
    <ul class="panel" id="country-panel"><li class="dropdown__option" data-label="Canada">Canada</li><li class="dropdown__option" data-label="Mexico">Mexico</li><li class="dropdown__option" data-label="United States">United States</li></ul></div></div>
  <div class="mine-dropdown"><label class="dropdown__header">State *</label>
    <div class="dropdown__wrapper"><input type="checkbox" class="dropdown__checkbox" id="dd-state"><label class="dropdown__label" for="dd-state" data-menu="state"><span class="dropdown__selected-value">Zacatecas</span></label>
    <ul class="panel" id="state-panel"><li class="dropdown__option" data-label="Alabama">Alabama</li><li class="dropdown__option" data-label="Illinois">Illinois</li><li class="dropdown__option" data-label="Zacatecas">Zacatecas</li></ul></div></div>
  <input type="hidden" name="country" id="country" value="Mexico"><input type="hidden" name="state" id="state" value="Zacatecas">
  <label>Email * <input type="email" name="email" required></label><br>
  <label>First name * <input name="first" required></label><br>
  <button type="submit">Submit</button>
</form>
<script>
document.querySelectorAll('[data-menu]').forEach(function (l) {
  var name = l.getAttribute('data-menu'), panel = document.getElementById(name + '-panel');
  l.addEventListener('click', function (e) { e.preventDefault(); panel.classList.toggle('open'); });
  panel.querySelectorAll('li').forEach(function (o) { o.addEventListener('click', function () {
    l.querySelector('.dropdown__selected-value').textContent = o.textContent; document.getElementById(name).value = o.textContent; panel.classList.remove('open'); }); });
});
</script>
