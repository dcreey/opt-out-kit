<h1>Remove Your Data ({{site}})</h1>
<p>Don't want your data in our databases? Please enter your information in the form below to find the data to remove.</p>
<!-- The search found nobody: the same form comes back with the error box the courtrecords.us sites show. Pressing again only searches again. -->
<div style="background:#f8d7da;padding:12px">Please fix the following input errors:<ul><li>No data was found, try other criteria...</li></ul></div>
<form method="POST" action="/{{site}}/send">
  <input type="text" name="fname" placeholder="First Name" required><br>
  <input type="text" name="lname" placeholder="Last Name" required><br>
  <input type="text" name="state" placeholder="State" required><br>
  <input type="text" name="city" placeholder="City"><br>
  <button type="submit">Submit</button>
</form>
