<h1>Privacy requests for {{site}}</h1>
<form method="POST" action="/{{site}}/send">
  <label>Full name <input type="text" name="name" required></label><br>
  <label>Email address <input type="email" name="email" required></label><br>
<p>What would you like to do? Choose one.</p>
  <label><input type="radio" name="request_type" value="know" required> Know what personal information you hold about me</label><br>
  <label><input type="radio" name="request_type" value="optout" required> Opt out of the sale or sharing of my personal information</label><br>
  <label><input type="radio" name="request_type" value="limit" required> Limit the use of my sensitive personal information</label><br>
  <button type="submit">Submit request</button>
</form>
