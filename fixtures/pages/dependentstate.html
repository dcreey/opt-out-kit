<h1>Opt out of {{site}}</h1>
<form method="POST" action="/{{site}}/send">
  <label>Full name <input type="text" name="name" required></label><br>
  <label>Email address <input type="email" name="email" required></label><br>
  <label for="country">Country *</label>
  <select id="country" name="country" required>
    <option value="">-- Select your country --</option><option value="CA">Canada</option><option value="US">United States</option>
  </select>
  <div id="statebox"></div>
  <button type="submit">Generate request</button>
</form>
<script>
// The State menu is built only once a country is chosen, as adagio.io's privacy center does.
document.getElementById('country').addEventListener('change', function () {
  var box = document.getElementById('statebox');
  box.innerHTML = this.value === 'US' ? '<label for="state">State *</label><select id="state" name="state" required><option value="">-- Select your state --</option>' +
    '<option value="AL">Alabama</option><option value="IL">Illinois</option><option value="OR">Oregon</option></select>' : '';
});
</script>
