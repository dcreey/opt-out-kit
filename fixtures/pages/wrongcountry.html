<h1>Data request ({{site}})</h1>
<!-- The arrests.org sites, reached from another country (a VPN): the form is taken in, and the page answers that it does not accept submissions from there. -->
<form method="POST" action="/{{site}}/send">
  <label>Email * <input type="email" name="email" required></label><br>
  <label>First name * <input name="first" required></label><br>
  <button type="submit">Submit</button>
</form>
