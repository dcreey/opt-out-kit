name: OptOutKit
options:
  bundleIdPrefix: dev.optoutkit
  developmentLanguage: en
  knownRegions: [en, fr, es, de, Base]
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    CODE_SIGN_STYLE: Automatic
packages:
  OptOutKitCore:
    path: Packages/OptOutKitCore
targets:
  OptOutKit:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
      - path: brokers
        type: folder
        buildPhase: resources
      - path: directory
        type: folder
        buildPhase: resources
      - path: terms
        type: folder
        buildPhase: resources
      - path: platforms
        type: folder
        buildPhase: resources
      - path: jurisdictions
        type: folder
        buildPhase: resources
      - path: registries/summary.json
        buildPhase: resources
    dependencies:
      - package: OptOutKitCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "Opt-Out Kit"
        UILaunchScreen: {}
        UIBackgroundModes: [fetch, processing]
        NSUserTrackingUsageDescription: "Some data brokers opt your phone out using its advertising ID. Opt-Out Kit reads it only to give it to those brokers when you opt out, and never stores it."
        LSApplicationQueriesSchemes: [googlegmail, ms-outlook, ymail, readdle-spark, protonmail]
        BGTaskSchedulerPermittedIdentifiers: [dev.optoutkit.app.recheck, dev.optoutkit.app.scan, dev.optoutkit.app.optout]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.optoutkit.app
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  OptOutKitTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: OptOutKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.optoutkit.app.tests
  OptOutKitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AppUITests]
    dependencies:
      - target: OptOutKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.optoutkit.app.uitests
schemes:
  OptOutKit:
    build:
      targets:
        OptOutKit: all
    test:
      targets: [OptOutKitTests, OptOutKitUITests]
