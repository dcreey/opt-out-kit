name: OptOutKit
options:
  bundleIdPrefix: dev.optoutkit
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
packages:
  OptOutKitCore:
    path: Packages/OptOutKitCore
targets:
  OptOutKit:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - path: brokers
        type: folder
        buildPhase: resources
      - path: directory
        type: folder
        buildPhase: resources
      - path: terms
        type: folder
        buildPhase: resources
    dependencies:
      - package: OptOutKitCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "Opt-Out Kit"
        UILaunchScreen: {}
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [dev.optoutkit.app.recheck, dev.optoutkit.app.scan, dev.optoutkit.app.optout]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.optoutkit.app
        GENERATE_INFOPLIST_FILE: NO
  OptOutKitTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: OptOutKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.optoutkit.app.tests
  OptOutKitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AppUITests]
    dependencies:
      - target: OptOutKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.optoutkit.app.uitests
schemes:
  OptOutKit:
    build:
      targets:
        OptOutKit: all
    test:
      targets: [OptOutKitTests, OptOutKitUITests]
