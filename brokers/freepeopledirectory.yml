id: freepeopledirectory
name: FreePeopleDirectory
tier: A
signals: [search_first]
fields: [full_name]
steps:
  - open: https://www.freepeopledirectory.com
  - say: "Search for yourself and copy the address of your listing. Its footer \"Do Not Sell My Info\" link goes to Spokeo, which runs the opt-out."
    confirm: true
  - open: https://www.spokeo.com/optout
  - say: "Paste your listing's address and enter your email. Solve the check if one appears."
  - wait_for_email:
      within_minutes: 60
  - say: "Open the confirmation link from the email."
    confirm: true
recheck_days: 120
processing_days: 3
# Checked 2026-10-20 with a made-up name (404 "No Result for") and "John Smith" (200 "Reports for John Smith").
# The name search has no city, so a name match alone counts as a listing.
recheck:
  search_url: "https://www.freepeopledirectory.com/name/{first}-{last}"
  valid_page: ["FreePeopleDirectory"]
  no_results: ["No Result for"]
  ignore_location: true
  calibration: { listed_name: "John Smith" }
# Route checked 2026-10-21: the site's 'Do Not Sell My Info' link goes to spokeo.com/privacy/control, which leads to spokeo.com/optout.
verified: null
