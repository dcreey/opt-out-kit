# yamllint for the YAML the tools write (directory/*.yml and terms/library.yml, each headed "GENERATED by tools/..."): what makes a file wrong or easy
# to misread, not its style. The tools write flow style ({ "a": 1 }) on long lines with double quotes, and 27 of them read those files back as text,
# so the style rules are off. Every other YAML file follows .yamllint.yml. docs/TESTING.md, "Lint".
extends: 'default'
rules:
  line-length: 'disable'
  braces: 'disable'
  brackets: 'disable'
  commas: 'disable'
  document-start: 'disable'
  comments: 'disable'
  comments-indentation: 'disable'
  truthy:
    allowed-values: ['true', 'false']
    check-keys: false
  indentation:
    spaces: 'consistent'
    indent-sequences: 'whatever'
