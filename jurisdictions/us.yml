# US jurisdictions: what each state requires of data brokers and gives to residents.
# Facts only, each with a source. Reviewed by a person on the date given; tools/check_jurisdictions.py flags entries older than 180 days.
# Sources: recordinglaw.com (registration laws, comparison chart), privacyterms.io and clym.io (comprehensive laws), cppa.ca.gov, privacy.ca.gov,
# dfr.oregon.gov, sos.state.tx.us, bizfilings.vermont.gov, and the global privacy control summaries from Foster Garvey and Kole Jessen.
# Secondary sources disagree on some dates; an entry says so where it matters. Check the agency page before treating a date as exact.
# GPC/universal opt-out: 'required' is stated by statute or rule in the sources checked; 'reported' is listed by some sources only.
