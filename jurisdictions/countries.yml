# Countries: what each place's law means for its residents, and which regulator to turn to. Same shape as us.yml, one entry per country.
# Researched 2026-10-22 from the regulators' own sites, the legislation, and DLA Piper's Data Protection Laws of the World summaries (cited per entry).
# No machine-readable database of these facts exists (UNCTAD's tracker says whether a law exists, Wikidata lists some regulators, Council of Europe
# lists Convention 108 parties); so each entry is read and written by hand and carries the date it was reviewed. A dash for `effective` means the
# date was not clear in the sources. Rights are `yes` (a defined right, with the usual exceptions), `limited` (exists in some circumstances only),
# `unclear` (the sources do not say) or `no`. Broker registries: only the US states publish ones we can pull; `databases` and `controllers`
# registries list organizations, not data brokers, so we do not pull them. This is not legal advice.
reviewed: 2026-10-22
